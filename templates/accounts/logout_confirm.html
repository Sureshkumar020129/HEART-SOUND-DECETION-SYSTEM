{% extends 'base.html' %}
{% block title %}Confirm Logout{% endblock %}
{% block content %}
<div class="container py-5 text-center">
  <div class="card-glass p-5 mx-auto" style="max-width: 480px;" data-aos="fade-up">
    <div class="stat-icon mx-auto mb-3 bg-secondary bg-opacity-10 text-white" style="width: 64px; height: 64px; font-size: 1.8rem;">
      <i class="bi bi-box-arrow-right"></i>
    </div>
    <h3 class="text-white mb-3">Sign Out?</h3>
    <p class="text-secondary small mb-4">Are you sure you want to end your active HeartSound AI session?</p>
    <form method="post" action="{% url 'accounts:logout' %}">
      {% csrf_token %}
      <div class="d-flex justify-content-center gap-3">
        <button type="submit" class="btn btn-danger"><i class="bi bi-box-arrow-right me-1"></i>Yes, Logout</button>
        <a href="{% url 'dashboard:dashboard' %}" class="btn btn-outline-secondary">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
