{% extends 'base.html' %}
{% block title %}Password Reset Complete{% endblock %}
{% block content %}
<div class="container py-5 text-center">
  <div class="card-glass p-5 mx-auto" style="max-width: 500px;" data-aos="fade-up">
    <div class="stat-icon mx-auto mb-3 bg-success bg-opacity-10 text-success" style="width: 64px; height: 64px; font-size: 1.8rem;">
      <i class="bi bi-shield-check"></i>
    </div>
    <h3 class="text-white mb-3">Password Updated</h3>
    <p class="text-secondary small mb-4">Your account password has been successfully reset. You may now log in with your new credentials.</p>
    <a href="{% url 'accounts:login' %}" class="btn btn-primary-glow">Sign In</a>
  </div>
</div>
{% endblock %}
