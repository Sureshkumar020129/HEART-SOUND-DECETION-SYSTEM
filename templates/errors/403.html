{% extends 'base.html' %}
{% block title %}Access Denied (403){% endblock %}
{% block content %}
<div class="container py-5 text-center">
  <div class="card-glass p-5 mx-auto" style="max-width: 540px;" data-aos="fade-up">
    <div class="stat-icon mx-auto mb-3 bg-danger bg-opacity-10 text-danger" style="width: 72px; height: 72px; font-size: 2rem;">
      <i class="bi bi-shield-lock-fill"></i>
    </div>
    <h1 class="display-5 text-white fw-bold">403</h1>
    <h4 class="text-danger mb-3">Access Forbidden</h4>
    <p class="text-secondary small mb-4">
      You do not have administrative or personal permission to access this protected medical recording or resource.
    </p>
    <a href="{% url 'dashboard:dashboard' %}" class="btn btn-primary-glow">
      <i class="bi bi-house me-2"></i>Return to Dashboard
    </a>
  </div>
</div>
{% endblock %}
