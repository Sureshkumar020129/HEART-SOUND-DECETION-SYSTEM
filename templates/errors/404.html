{% extends 'base.html' %}
{% block title %}Page Not Found (404){% endblock %}
{% block content %}
<div class="container py-5 text-center">
  <div class="card-glass p-5 mx-auto" style="max-width: 540px;" data-aos="fade-up">
    <div class="stat-icon mx-auto mb-3 bg-primary bg-opacity-10 text-cyan" style="width: 72px; height: 72px; font-size: 2rem;">
      <i class="bi bi-question-circle"></i>
    </div>
    <h1 class="display-5 text-white fw-bold">404</h1>
    <h4 class="text-white mb-3">Resource Not Found</h4>
    <p class="text-secondary small mb-4">
      The requested page, analysis record, or report does not exist or may have been deleted.
    </p>
    <a href="{% url 'core:home' %}" class="btn btn-outline-cyan">
      <i class="bi bi-arrow-left me-2"></i>Return Home
    </a>
  </div>
</div>
{% endblock %}
