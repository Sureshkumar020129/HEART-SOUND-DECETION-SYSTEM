{% extends 'base.html' %}
{% block title %}Email Sent{% endblock %}
{% block content %}
<div class="container py-5 text-center">
  <div class="card-glass p-5 mx-auto" style="max-width: 520px;" data-aos="fade-up">
    <div class="stat-icon mx-auto mb-3 bg-success bg-opacity-10 text-success" style="width: 64px; height: 64px; font-size: 1.8rem;">
      <i class="bi bi-envelope-check"></i>
    </div>
    <h3 class="text-white mb-3">Check Your Inbox</h3>
    <p class="text-secondary small mb-4">
      If an account exists with the provided email address, we have dispatched password reset instructions. (In development mode, check your application console).
    </p>
    <a href="{% url 'accounts:login' %}" class="btn btn-outline-cyan">Back to Login</a>
  </div>
</div>
{% endblock %}
