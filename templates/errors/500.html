{% extends 'base.html' %}
{% block title %}System Error (500){% endblock %}
{% block content %}
<div class="container py-5 text-center">
  <div class="card-glass p-5 mx-auto" style="max-width: 540px;" data-aos="fade-up">
    <div class="stat-icon mx-auto mb-3 bg-danger bg-opacity-10 text-danger" style="width: 72px; height: 72px; font-size: 2rem;">
      <i class="bi bi-exclamation-octagon"></i>
    </div>
    <h1 class="display-5 text-white fw-bold">500</h1>
    <h4 class="text-white mb-3">Internal Processing Error</h4>
    <p class="text-secondary small mb-4">
      An unexpected error occurred while processing this request. Our administrative team has been notified via secure audit logging.
    </p>
    <a href="{% url 'dashboard:dashboard' %}" class="btn btn-primary-glow">
      <i class="bi bi-arrow-clockwise me-2"></i>Return to Dashboard
    </a>
  </div>
</div>
{% endblock %}
